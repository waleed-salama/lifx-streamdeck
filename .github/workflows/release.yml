name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish plugin
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.16.x"

      - name: Validate manifest version
        run: |
          manifest_version="$(python3 -c 'import json; print("v" + json.load(open("manifest.json"))["Version"])')"
          test "$GITHUB_REF_NAME" = "$manifest_version"

      - name: Build binaries
        run: |
          COMMIT="${GITHUB_SHA::7}"
          GOOS=darwin GOARCH=amd64 go build -v -ldflags "-X main.commit=$COMMIT -X main.version=$GITHUB_REF_NAME" -o lifx-streamdeck
          GOOS=windows GOARCH=amd64 go build -v -ldflags "-X main.commit=$COMMIT -X main.version=$GITHUB_REF_NAME" -o lifx-streamdeck.exe

      - name: Build Stream Deck plugin bundle
        run: |
          mkdir -p dev.sean.lifx.sdPlugin/attribution
          cp lifx-streamdeck.exe dev.sean.lifx.sdPlugin
          cp lifx-streamdeck dev.sean.lifx.sdPlugin
          cp manifest.json dev.sean.lifx.sdPlugin
          cp -r property-inspector/* dev.sean.lifx.sdPlugin
          cp images/* dev.sean.lifx.sdPlugin
          cp LICENSE dev.sean.lifx.sdPlugin
          zip -r dev.sean.lifx.streamDeckPlugin dev.sean.lifx.sdPlugin

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dev.sean.lifx.streamDeckPlugin
