name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish plugin
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate manifest version
        run: |
          manifest_version="$(python3 -c 'import json; print("v" + json.load(open("manifest.json"))["Version"])')"
          test "$GITHUB_REF_NAME" = "$manifest_version"

      - name: Build binaries
        run: |
          go version
          COMMIT="${GITHUB_SHA::7}"
          GOOS=darwin GOARCH=amd64 go build -v -ldflags "-X main.commit=$COMMIT -X main.version=$GITHUB_REF_NAME" -o lifx-streamdeck
          GOOS=windows GOARCH=amd64 go build -v -ldflags "-X main.commit=$COMMIT -X main.version=$GITHUB_REF_NAME" -o lifx-streamdeck.exe

      - name: Build Stream Deck plugin bundle
        run: |
          mkdir -p com.waleed-salama.lifx-plus.sdPlugin/attribution
          cp lifx-streamdeck.exe com.waleed-salama.lifx-plus.sdPlugin
          cp lifx-streamdeck com.waleed-salama.lifx-plus.sdPlugin
          cp manifest.json com.waleed-salama.lifx-plus.sdPlugin
          cp -r property-inspector/* com.waleed-salama.lifx-plus.sdPlugin
          cp images/* com.waleed-salama.lifx-plus.sdPlugin
          cp LICENSE com.waleed-salama.lifx-plus.sdPlugin
          zip -r com.waleed-salama.lifx-plus.streamDeckPlugin com.waleed-salama.lifx-plus.sdPlugin

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: com.waleed-salama.lifx-plus.streamDeckPlugin
