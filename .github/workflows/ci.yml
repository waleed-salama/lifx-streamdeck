name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.16.x"

      - name: Download modules
        run: go mod download

      - name: Run tests
        run: go test ./...

  build:
    name: Build ${{ matrix.goos }}
    runs-on: ubuntu-latest
    needs: test

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            output: lifx-streamdeck
          - goos: windows
            output: lifx-streamdeck.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.16.x"

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: amd64
        run: |
          COMMIT="${GITHUB_SHA::7}"
          go build -v -ldflags "-X main.commit=$COMMIT -X main.version=develop" -o "${{ matrix.output }}"
