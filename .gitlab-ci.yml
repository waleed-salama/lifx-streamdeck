---
stages:
  - vulnerability
  - build
  - dist
  - antivirus

variables:
  version: 0.1.0

snyk-scan:
  stage: vulnerability
  image: node:14.2
  before_script:
    - apt install -y wget tar
    - wget -q https://dl.google.com/go/go1.14.4.linux-amd64.tar.gz -O /tmp/go1.14.4.linux-amd64.tar.gz
    - tar -C /usr/local -xzf /tmp/go1.14.4.linux-amd64.tar.gz
  script:
    - export PATH=$PATH:/usr/local/go/bin
    - npm install -g snyk
    - snyk auth $SNYK_TOKEN
    - snyk test

compile-windows:
  stage: build
  image: golang:1.14
  script:
    - go mod download
    - if [ -n "$CI_COMMIT_TAG" ]; then export version=$CI_COMMIT_TAG; fi
    - GOOS=windows go build -v -ldflags "-X main.commit=$CI_COMMIT_SHORT_SHA -X main.version=$version"
  artifacts:
    paths:
      - lifx-streamdeck.exe
  except:
    - schedules

compile-mac:
  stage: build
  image: golang:1.14
  script:
    - go mod download
    - if [ -n "$CI_COMMIT_TAG" ]; then export version=$CI_COMMIT_TAG; fi
    - GOOS=darwin GOARCH=amd64 go build -v -ldflags "-X main.commit=$CI_COMMIT_SHORT_SHA -X main.version=$version"
  artifacts:
    paths:
      - lifx-streamdeck
  except:
    - schedules

generate-license-data:
  stage: build
  image: golang:1.14
  before_script:
    - go get github.com/google/go-licenses
  script:
    # a library I am managing has a "forbidden" license, which causes it to have a bad return code.
    # I am ok with this so forcing it to have a clean return code via the || true
    - go-licenses save "gitlab.com/wwsean08/lifx-streamdeck" --save_path="attribution" || true
  artifacts:
    paths:
      - "attribution"
  except:
    - schedules

generate-bundle:
  stage: dist
  image: ubuntu:20.04
  before_script:
    - apt update && apt install -y zip
  script:
    - mkdir dev.sean.lifx.sdPlugin
    - cp lifx-streamdeck.exe dev.sean.lifx.sdPlugin
    - cp lifx-streamdeck dev.sean.lifx.sdPlugin
    - cp manifest.json dev.sean.lifx.sdPlugin
    - cp property-inspector/* dev.sean.lifx.sdPlugin
    - cp images/* dev.sean.lifx.sdPlugin
    - cp LICENSE dev.sean.lifx.sdPlugin
    - cp -r attribution dev.sean.lifx.sdPlugin
    - zip -r dev.sean.lifx.streamDeckPlugin dev.sean.lifx.sdPlugin
  artifacts:
    paths:
      - dev.sean.lifx.streamDeckPlugin
  except:
    - schedules

virus-total-scan:
  stage: antivirus
  image: ubuntu:20.04
  before_script:
    - apt update && apt install -y curl jq
  script:
    - curl --request POST --url 'https://www.virustotal.com/vtapi/v2/file/scan' -o upload.json --form "apikey=$VT_API_KEY" --form 'file=@./dev.sean.lifx.streamDeckPlugin'
    - export SCANID=$(cat upload.json | jq .sha256 | tr -d '"')
    - sleep 300
    - curl --request GET -o results.json --url "https://www.virustotal.com/vtapi/v2/file/report?apikey=$VT_API_KEY&resource=$SCANID"
    - echo "Positives Found $(cat results.json | jq .positives), results at $(cat results.json | jq .permalink)"
    - exit $(cat results.json | jq .positives)
  artifacts:
    paths:
      - upload.json
      - results.json
  except:
    - schedules